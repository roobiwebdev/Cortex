# macOS checks for the desktop recorder (crates/*, apps/desktop). See docs/engineering/desktop.md.
# The Linux ci.yml job does not build Rust; this one only runs when desktop inputs change.
#
# Real ScreenCaptureKit capture cannot run here: hosted runners have no way to grant
# Screen Recording, Camera or Microphone (TCC). The recording smoke uses Rec's test
# pattern, which needs none of them. No signing secrets are configured, so the app
# bundle is unsigned.
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packages/ui/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packages/ui/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # rustup is preinstalled on macOS runners. With no arguments it installs the
      # channel, components and targets pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # apple-cryptokit-rs builds a Swift package; third_party/ patches it for Swift 6.4.
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt (crates we own)
        run: cargo fmt --check -p rec-core -p cortex-desktop

      - name: cargo clippy (crates we own)
        run: cargo clippy --locked -p rec-core -p cortex-desktop -p rec-macos-ui --no-deps --all-targets -- -D warnings

      - name: cargo test
        # Release mode: four tests of the legacy egui app (crates/rec-cli/src/app) trip a
        # debug-only epaint assertion. That app is removed once the Tauri UI replaces it.
        run: cargo test --locked --workspace --release --no-fail-fast

      - name: Install ffprobe
        run: command -v ffprobe || brew install ffmpeg

      # Records 3 s of the test pattern through MacEngine and checks the file with
      # ffprobe and an AVFoundation probe. Hosted macOS runners are VMs; if
      # VideoToolbox or Metal is unavailable there, this is the step that shows it.
      - name: Test-pattern recording smoke
        run: cargo run --locked --release -p rec-engine-macos --example engine_smoke -- "$RUNNER_TEMP/engine-smoke"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter desktop check-types

      - name: Unsigned debug app bundle
        run: pnpm --filter desktop tauri build --debug --bundles app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-smoke
          path: ${{ runner.temp }}/engine-smoke
          if-no-files-found: ignore
          retention-days: 7
