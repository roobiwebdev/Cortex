# Linux checks and installers for the desktop recorder (crates/rec-engine-linux, apps/desktop).
# See docs/engineering/platforms.md and docs/engineering/releasing.md.
#
# Two ways in:
#   - push / pull_request: CI on x86_64. Proves fmt, clippy, the unit tests, the engine's
#     headless runtime tests (real GStreamer pipelines fed by the test pattern) and the
#     deb/rpm/AppImage bundles.
#   - workflow_call from release.yml: the same checks, then the release installers for one
#     architecture under the stable asset names, as an artifact the assemble script downloads.
#
# Hosted runners have no Wayland session, no xdg-desktop-portal, no GPU and no audio devices.
# Portal capture, hardware encoders and global shortcuts are checked on a Linux PC with
# docs/engineering/linux-testing.md. scripts/desktop/linux-dev.Dockerfile is the same
# environment for local runs.
#
# Bundles are never signed here: the updater key stays on the release Mac, and
# scripts/release/assemble.sh signs the files after downloading them.
name: Desktop (Linux)

on:
  push:
    # agent/desktop-recorder-4c1e9 is the default branch of roobiwebdev/cortex.
    branches: [main, agent/desktop-recorder-4c1e9]
    paths:
      - "crates/rec-core/**"
      - "crates/rec-engine-linux/**"
      - "apps/desktop/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/release/stage.sh"
      - ".github/workflows/desktop-linux.yml"
  pull_request:
    paths:
      - "crates/rec-core/**"
      - "crates/rec-engine-linux/**"
      - "apps/desktop/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/release/stage.sh"
      - ".github/workflows/desktop-linux.yml"
  workflow_call:
    inputs:
      runner:
        description: Runner label (ubuntu-24.04 for x86_64, ubuntu-24.04-arm for arm64)
        type: string
        default: ubuntu-24.04
      group:
        description: Release group, linux-x64 or linux-arm64 (names the files and the artifact)
        type: string
        default: linux-x64
      version:
        description: Release version; must match tauri.conf.json
        type: string
        required: true
      optional:
        description: Let the release run succeed when this job fails (arm64 runners)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ inputs.group || 'linux-x64' }})
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 75
    continue-on-error: ${{ inputs.optional == true }}
    concurrency:
      group: desktop-linux-${{ github.workflow }}-${{ github.ref }}-${{ inputs.group || 'linux-x64' }}
      cancel-in-progress: ${{ inputs.version == '' || inputs.version == null }}
    env:
      # linuxdeploy is an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
      GROUP: ${{ inputs.group || 'linux-x64' }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in step with scripts/desktop/linux-dev.Dockerfile.
      - name: Install system packages (Tauri, GStreamer, PipeWire, D-Bus, V4L2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pipewire \
            gstreamer1.0-pulseaudio libdbus-1-dev libv4l-dev ffmpeg \
            rpm squashfs-tools desktop-file-utils xdg-utils

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check the release version
        if: env.VERSION != ''
        run: |
          conf="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          [ "$conf" = "$VERSION" ] || { echo "::error::tauri.conf.json is $conf, the release is $VERSION (run scripts/desktop/bump-version.sh)"; exit 1; }

      # rust-toolchain.toml pins the channel; rustup adds the host target on its own.
      # The arm64 runner image may not ship rustup.
      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.GROUP }}

      # rec-engine-macos and rec-cli are macOS-only workspace members, so every cargo
      # command names the crates that build on Linux.
      - name: cargo fmt
        run: cargo fmt --check -p rec-core -p rec-engine-linux -p cortex-desktop

      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the built web assets.
      - run: pnpm --filter desktop build

      - name: cargo clippy
        run: cargo clippy --locked --no-deps -p rec-core -p rec-engine-linux -p cortex-desktop --all-targets -- -D warnings

      # Includes crates/rec-engine-linux/tests/engine.rs: real recordings of the test
      # pattern (pause, discard, countdown, HEVC when x265 is installed).
      - name: cargo test
        run: cargo test --locked -p rec-core -p rec-engine-linux -p cortex-desktop -- --test-threads=2

      - run: pnpm --filter desktop check-types

      - run: pnpm --filter desktop test

      # deb, rpm and AppImage from tauri.linux.conf.json. No updater signatures here.
      - name: Bundle
        run: pnpm --filter desktop tauri build --bundles deb,rpm,appimage

      - name: Stage under the release names
        run: bash scripts/release/stage.sh "$GROUP" target/release/bundle dist/stage "${VERSION:-*}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cortex-${{ env.GROUP }}
          path: dist/stage/*
          if-no-files-found: error
          retention-days: 7
