# Linux checks for the desktop recorder (crates/rec-engine-linux, apps/desktop).
# See docs/engineering/platforms.md.
#
# Hosted runners have no Wayland session, no xdg-desktop-portal, no GPU and no audio
# devices. This job proves the build, clippy, the unit tests, the engine's headless runtime
# tests (real GStreamer pipelines fed by the test pattern) and the deb/rpm/AppImage
# bundles. Portal capture, hardware encoders and global shortcuts are checked on a Linux PC
# with the test script in docs/engineering/platforms.md.
# scripts/desktop/linux-dev.Dockerfile is the same environment for local runs.
name: Desktop (Linux)

on:
  push:
    branches: [main]
    paths:
      - "crates/rec-core/**"
      - "crates/rec-engine-linux/**"
      - "apps/desktop/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-linux.yml"
  pull_request:
    paths:
      - "crates/rec-core/**"
      - "crates/rec-engine-linux/**"
      - "apps/desktop/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-linux.yml"

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # linuxdeploy is an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Tauri, GStreamer, PipeWire, D-Bus, V4L2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pipewire \
            gstreamer1.0-pulseaudio libdbus-1-dev libv4l-dev ffmpeg rpm

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # rust-toolchain.toml pins the channel; rustup adds the host target on its own.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # rec-engine-macos and rec-cli are macOS-only workspace members, so every cargo
      # command names the crates that build on Linux.
      - name: cargo fmt
        run: cargo fmt --check -p rec-core -p rec-engine-linux -p cortex-desktop

      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the built web assets.
      - run: pnpm --filter desktop build

      - name: cargo clippy
        run: cargo clippy --locked --no-deps -p rec-core -p rec-engine-linux -p cortex-desktop --all-targets -- -D warnings

      # Includes crates/rec-engine-linux/tests/engine.rs: real recordings of the test
      # pattern (pause, discard, countdown, HEVC when x265 is installed).
      - name: cargo test
        run: cargo test --locked -p rec-core -p rec-engine-linux -p cortex-desktop -- --test-threads=2

      - run: pnpm --filter desktop check-types

      - run: pnpm --filter desktop test

      # deb, rpm and AppImage from tauri.linux.conf.json. Unsigned.
      - name: Bundle
        run: pnpm --filter desktop tauri build --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: cortex-linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
