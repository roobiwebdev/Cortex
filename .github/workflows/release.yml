# Release installers for Windows and Linux. See docs/engineering/releasing.md.
#
# Runs the platform checks, then builds the installers under the stable asset names and keeps
# them as run artifacts for 7 days. Nothing is published from here: on the release Mac,
# scripts/release/assemble.sh downloads these artifacts, adds the macOS build, signs every
# updater file with the updater key (which never leaves that Mac, so no signing secret is
# configured here), writes latest.json, and scripts/release/publish.sh uploads the lot to
# roobiwebdev/cortex-releases.
#
# There is no macOS job on purpose: the app is signed with a certificate in the release Mac's
# login keychain, and that certificate never goes into CI.
#
# Trigger: push a tag v<version> (matching tauri.conf.json), or run it by hand with the version.
name: Release

# assemble.sh finds the run by this title.
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the v (must match tauri.conf.json), e.g. 0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="${INPUT_VERSION#v}"; else version="${REF_NAME#v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version"
            exit 1
          fi
          conf="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          if [ "$conf" != "$version" ]; then
            echo "::error::tauri.conf.json is $conf, the release is $version (run scripts/desktop/bump-version.sh and commit)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Release $version from $(git rev-parse HEAD)" >>"$GITHUB_STEP_SUMMARY"

  windows-x64:
    needs: version
    uses: ./.github/workflows/desktop-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  linux-x64:
    needs: version
    uses: ./.github/workflows/desktop-linux.yml
    with:
      runner: ubuntu-24.04
      group: linux-x64
      version: ${{ needs.version.outputs.version }}

  # Hosted arm64 Linux runners. If this label is not available to the repository (private
  # repositories on some plans), the job waits for a runner and never starts: set the
  # repository variable LINUX_ARM64 to "off" and build arm64 on the Mac with
  # scripts/release/build-linux-docker.sh instead. A failure here does not fail the release run.
  linux-arm64:
    needs: version
    if: vars.LINUX_ARM64 != 'off'
    uses: ./.github/workflows/desktop-linux.yml
    with:
      runner: ubuntu-24.04-arm
      group: linux-arm64
      version: ${{ needs.version.outputs.version }}
      optional: true
