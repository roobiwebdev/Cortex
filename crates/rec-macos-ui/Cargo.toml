[package]
name = "rec-macos-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native macOS UI pieces for the Cortex desktop recorder: live preview view under the webview, floating panel helpers"

[lib]
name = "rec_macos_ui"

[dependencies]
# Same objc2 family versions as rec-engine-macos, so both crates share one copy.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-video", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-video"] }
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
# Safe entry points for hosts (Tauri windows implement HasWindowHandle).
raw-window-handle = "0.6"

[dev-dependencies]
# The demo feeds frames through the same PreviewFn type the engine uses.
rec-engine-macos = { path = "../rec-engine-macos" }
