[package]
name = "rec-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Platform-neutral settings, state and engine API for the Cortex desktop recorder"

[features]
# Derive `specta::Type` so tauri-specta can generate the TypeScript bindings.
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the version tauri-specta 2.0.0-rc.26 requires.
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }

[dev-dependencies]
