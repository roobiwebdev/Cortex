[package]
name = "rec-engine-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Screen, camera and audio recording engine for Linux (portal + PipeWire + GStreamer)"

# The planning code (encoder choice, pipeline text, pause timeline, overlay mask, capabilities)
# is plain Rust and builds and tests on every OS. The engine itself is Linux-only.
[dependencies]
rec-core = { path = "../rec-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-pbutils = "0.25"
gstreamer-app = "0.25"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast", "global_shortcuts"] }
futures-util = "0.3"
pollster = "0.4"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustix = { version = "1", features = ["fs"] }
