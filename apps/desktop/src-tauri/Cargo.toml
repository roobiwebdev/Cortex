[package]
name = "cortex-desktop"
version = "0.1.1"
description = "Cortex desktop recorder (Tauri shell)"
authors = ["Cortex"]
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the bin target (Tauri 2 template).
name = "cortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri-specta is a release candidate: versions are pinned with `=` as its docs require.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
rec-core = { path = "../../../crates/rec-core", features = ["specta"] }
# Native TLS: the OS trust store on every platform (Security.framework, SChannel, OpenSSL).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# One running copy: a second launch focuses the first (MIT OR Apache-2.0). See lib.rs.
tauri-plugin-single-instance = "2.5.5"

# The macOS engine and window behaviour. Other targets build the stub in
# src/platform/unsupported.rs (see docs/engineering/platforms.md).
[target.'cfg(target_os = "macos")'.dependencies]
rec-engine-macos = { path = "../../../crates/rec-engine-macos" }
rec-macos-ui = { path = "../../../crates/rec-macos-ui" }

# The Windows engine (Windows.Graphics.Capture, Media Foundation, WASAPI) and its
# window helpers. See src/platform/windows.rs.
[target.'cfg(windows)'.dependencies]
rec-engine-windows = { path = "../../../crates/rec-engine-windows" }

# The Linux engine (ScreenCast portal, PipeWire, GStreamer) and its desktop helpers.
# glib and gtk are the versions Tauri uses: shortcut activations and signals run on the
# GTK main loop, and floating windows are realized before their input shape is set.
# See src/platform/linux.rs.
[target.'cfg(target_os = "linux")'.dependencies]
rec-engine-linux = { path = "../../../crates/rec-engine-linux" }
glib = "0.18"
gtk = "0.18"
