<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Cortex app icon, full-bleed shape for Windows and Linux: a 976 px tile, 24 px margin.
       The mark is a heavy "C" ring in brand teal (hue 188) around the red record dot. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263039"/>
      <stop offset="1" stop-color="#10151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1fb5cc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1fb5cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61d8e5"/>
      <stop offset="1" stop-color="#28a0b8"/>
    </linearGradient>
    <radialGradient id="rec" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff7175"/>
      <stop offset="1" stop-color="#e2383e"/>
    </radialGradient>
  </defs>
  <g>
    <rect x="24" y="24" width="976" height="976" rx="200" fill="url(#tile)"/>
  </g>
  <rect x="24" y="24" width="976" height="976" rx="200" fill="url(#glow)"/>
  <rect x="26" y="26" width="972" height="972" rx="198" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- The glyph is 12% larger than on macOS so it fills the bigger tile at taskbar sizes. -->
  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <path d="M664.6 342.6A228 228 0 1 0 664.6 681.4" fill="none" stroke="url(#teal)" stroke-width="128" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="92" fill="url(#rec)"/>
  </g>
</svg>
